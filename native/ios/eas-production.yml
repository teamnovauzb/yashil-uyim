build:
  name: Yashil Uyim Capacitor iOS store build
  steps:
    - eas/checkout
    - run:
        name: Resolve the pinned native Swift packages
        command: xcodebuild -resolvePackageDependencies -project ios/App.xcodeproj -scheme App
    - eas/configure_ios_credentials
    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }
          scheme: App
          build_configuration: Release
    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
